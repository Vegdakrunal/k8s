      ports:
        - "5601:5601"
      networks:
        - adopt-network
      restart: on-failure
      logging:
         driver: "json-file"
         options:
           max-size: "10m"
           max-file: "3"
      links:
        - elasticsearch
      depends_on:
        - elasticsearch
      environment:
        - ELASTICSEARCH_URL=192.168.24.87:9200
        - ELASTICSEARCH_USERNAME=elastic  # Username for Kibana to authenticate with Elasticsearch

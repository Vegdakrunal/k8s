    logstash:
      container_name: logstash
      image: adoptnettech/adopt-logstash:logstash
      ports:
        - 25826:25826
        - 5040:5044
      volumes:
        - /root/logstash/pipeline:/usr/share/logstash/pipeline:ro
      restart: on-failure
      networks:
        - adopt-network
      depends_on:
        - elasticsearch
      environment:
        - xpack.monitoring.elasticsearch.url=192.168.24.87:9200  # Set Elasticsearch host URL
        - xpack.monitoring.elasticsearch.username=elastic
        - xpack.monitoring.elasticsearch.password=adopt@123   # Same password as Kibana and Elasticsearch
        - xpack.monitoring.enabled=true
      #deploy:
            #resources:
                #limits:
                    #cpus: 2 # Set CPU limit to 4 cores
                    #memory: 4G  # Set memory limit to 8 gigabytes

    elasticsearch:
      container_name: elasticsearch
      image: adoptnettech/adopt-elasticsearch:elasticsearch
      logging:
         driver: "json-file"
         options:
           max-size: "10m"
           max-file: "3"
      restart: on-failure
      ports:
        - "9200:9200"
      networks:
        - adopt-network
      environment:
        - xpack.security.enabled=true  # Enable security for Elasticsearch
        - discovery.type=single-node
        - xpack.security.audit.enabled=true
        - ELASTIC_PASSWORD=adopt@123  # Password for the 'adminadopt' superuser
      volumes:
        - /root/elasticsearch/data:/root/home/elasticsearch/data:rw
      #deploy:
            #resources:
                #limits:
                    #cpus: 2 # Set CPU limit to 4 cores
                    #memory: 4G  # Set memory limit to 8 gigabytes


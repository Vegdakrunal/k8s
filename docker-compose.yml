version: '3.8'
services:
    eureka:
        container_name: eureka
        image: adoptnettech/adopt-eureka-server-image:V-2.1
        restart: always
        ports:
            - 8761:8761
        networks:
            - adopt-network
        volumes:
            - "/etc/localtime:/etc/localtime:ro"
        environment:
          - TZ=Asia/Yangon
          - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://euraka:8761/eureka
          - server.ssl.enabled=false
          - server.ssl.key-store=/root/Cert1.pfx
          - server.ssl.key-store-type=pkcs12
          - server.ssl.key-store-password=secret
          - server.ssl.key-password=secret
        logging:
           driver: "json-file"
           options:
             max-size: "10m"
             max-file: "3"
        #deploy:
            #resources:
                #limits:
                    #cpus: 2 # Set CPU limit to 4 cores
                    #memory: 4G  # Set memory limit to 8 gigabytes

    zookeeper:
      container_name: zookeeper
      restart: always
      image: adoptnettech/zookeeper:latest
      environment:
        - ZOOKEEPER_CLIENT_PORT=2181
        - ZOOKEEPER_TICK_TIME=2000
        - ZOOKEEPER_SERVER_ID=1
        - ZOOKEEPER_PEER_PORT=2888
        - ZOOKEEPER_LEADER_PORT=3888
        - ZOOKEEPER_INIT_LIMIT=5
        - ZOOKEEPER_SYNC_LIMIT=2
        - ZOOKEEPER_SERVERS=0.0.0.0:2888:3888
      ports:
        - 2181:2181
        - 22181:22181
        - 2888:2888
        - 3888:3888
      volumes:
        - /var/lib/docker/zookeeper/log:/var/lib/zookeeper/log
        - /var/lib/docker/zookeeper/secrets:/etc/zookeeper/secrets
        - zookeeper:/var/lib/zookeeper/data
      user: root:root
      networks:
        - adopt-network
      #deploy:
            #resources:
                #limits:
                    #cpus: 2 # Set CPU limit to 4 cores
                    #memory: 4G  # Set memory limit to 8 gigabytes

    kafka:
      image: adoptnettech/kafka:latest
      restart: always
      container_name: kafka
      depends_on:
        - zookeeper
      environment:
        - KAFKA_BROKER_ID=1
        - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
        - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://192.168.24.87:30084
        - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        - KAFKA_LISTENER_NAME=PLAINTEXT://0.0.0.0:30084
        - KAFKA_LISTENER_PORT=29092
        - KAFKA_LISTENER_HOSTNAME=0.0.0.0
        - KAFKA_LISTENER_INTER_BROKER_SECURITY_PROTOCOL=PLAINTEXT
        - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
        - KAFKA_ZOOKEEPER_SYNC_TIME=3000
        - KAFKA_REPLICA_FETCH_MAX_BYTES=2000000000  # Increase to 1 GB
        - KAFKA_MAX_REQUEST_SIZE=2000000000        # Increase to 1 GB
        - KAFKA_LOG_MESSAGE_MAX_BYTES=2000000000   # 1 GB (log segment si
        - KAFKA_MESSAGE_MAX_BYTES=2000000000       # 1 GB (maximum messag
        - KAFKA_SOCKET_RECEIVE_BUFFER_BYTES=1048576000  # 1 GB (increase
        - KAFKA_SOCKET_SEND_BUFFER_BYTES=1048576000    # 1 GB (increase s
        - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
        - KAFKA_SOCKET_REQUEST_MAX_BYTES=1200000000
        - KAFKA_HEAP_OPTS=-Xms4G -Xmx16G
        - log.retention.hours=168  # Retain logs for 7 days
        - log.retention.bytes=1073741824  # Retain logs up to 1 GB
        - log.segment.bytes=1073741824  # Segment size of 1 GB
        - KAFKA_FETCH_MIN_BYTES=524288     # 512 KB
        - KAFKA_FETCH_MAX_BYTES=10485760   # 10 MB
        - KAFKA_MAX_PARTITION_FETCH_BYTES=10485760   # 10MB
        - KAFKA_ENABLE_AUTO_COMMIT=true    # Auto commit offsets
        - KAFKA_SESSION_TIMEOUT_MS=10000   # Detect slow consumers faster
        - KAFKA_HEARTBEAT_INTERVAL_MS=3000 # Prevent rebalancing issues
      user: root:root
      ports:
        - 29092:29092
        - 30084:30084
      volumes:
        - /var/lib/docker/kafka/logs:/var/lib/kafka/log
        - kafka:/var/lib/kafka/data
      networks:
        - adopt-network
      deploy:
        resources:
          limits:
            cpus: 4 # Set CPU limit to 4 cores
            memory: 6G  # Set memory limit to 8 gigabytes

    akhq:
      image: adoptnettech/kafkagui:latest
      restart: always
      container_name: akhq
      ports:
        - "8088:8080"
      environment:
        AKHQ_CONFIGURATION: |
          akhq:
            connections:
              kafka-cluster:
                properties:
                  bootstrap.servers: 192.168.24.87:30084
      depends_on:
        - kafka
      networks:
        - adopt-network
      #deploy:
            #resources:
                #limits:
                    #cpus: 2 # Set CPU limit to 4 cores
                    #memory: 4G  # Set memory limit to 8 gigabytes


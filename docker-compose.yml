      command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --lower_case_table_names=1 --max_connections=5000 --log_bin_trust_function_creators=1 --server_id=1 --binlog_checksum=NONE --gtid_mode=ON --enforce_gtid_consistency=ON --log_bin --log_slave_updates=ON --master_info_repository=TABLE --relay_log_info_repository=TABLE --transaction_write_set_extraction=XXHASH64 --user=mysql --skip-host-cache --skip-name-resolve --default_authentication_plugin=mysql_native_password --bind-address=0.0.0.0 --port=3306 --innodb_buffer_pool_size=17179869184
      security_opt:
        - seccomp:unconfined
      volumes:
        - ./docker/provision/mysql/init:/docker-entrypoint-initdb.d
        - dbdata:/var/lib/mysql
        - "/etc/localtime:/etc/localtime:ro"
